format = "  $username$directory$git_status$python$line_break$character"

[username]
style_user = "bold #9F5E63"
style_root = "bold red"
show_always = true

[git_status]
format = '([with ]()[$all_status$ahead_behind](bold #A8502A) )'
style = "bold #A8502A"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "✎${count} "
untracked = "?${count} "
staged = "+${count} "
deleted = "✕${count} "
stashed = "󰏗 "
conflicted = "⚠${count} "

[python]
format = "([with]()${virtualenv})"
style = "bold #A8502A"

[directory]
style = "bold #A8502A"
truncate_to_repo = false
truncation_length = 3

[character]
success_symbol = "[  ❯](bold #b5aeb7)"
error_symbol = "[  ❯](bold #b5aeb7)"
