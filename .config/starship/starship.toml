format = "  $username$directory$git_status$python$line_break$character"

[username]
style_user = "bold #CD5C17"
style_root = "bold red"
show_always = true

[git_status]
format = '([with ]()[$all_status$ahead_behind](bold #995C1B) )'
style = "bold #995C1B"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "✎${count} "
untracked = "?${count} "
staged = "+${count} "
deleted = "✕${count} "
stashed = "󰏗 "
conflicted = "⚠${count} "

[python]
format = "(${virtualenv})"

[directory]
style = "bold #995C1B"
truncate_to_repo = false
truncation_length = 3

[character]
success_symbol = "[  ❯](bold #87dfc9)"
error_symbol = "[  ❯](bold #972F0B)"
