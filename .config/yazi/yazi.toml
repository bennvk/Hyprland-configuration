[mgr]
ratio = [1, 3, 4]
linemode = "size_and_mtime"

[preview]
max_width = 1500
max_height = 750

[opener]
edit = [
  { run = 'nvim "$@"',      block = true,  desc = "Neovim" },
  { run = 'codium "$@"',    orphan = true, desc = "VSCodium" },
]
view_image = [
  { run = 'swayimg "$@"',   orphan = true, desc = "Swayimg" },
]
view_document = [
  { run = 'librewolf "$@"', orphan = true, desc = "Librewolf" },
]

[open]
rules = [
  { mime = "image/*",          use = "view_image" },
  { mime = "application/pdf",  use = "view_document" },
  { name = "*.pdf",            use = "view_document" },
  { mime = "text/*",           use = "edit" },
  { name = "*.txt",            use = "edit" },
  { name = "*.json",           use = "edit" },
  { mime = "application/json", use = "edit" },
  { name = "*.sh",             use = "edit" },
  { name = "*.py",             use = "edit" },
  { name = "*.toml",           use = "edit" },
  { name = "*.yaml",           use = "edit" },
  { name = "*.yml",            use = "edit" },
  { name = "*.xml",            use = "edit" },
  { name = "*.csv",            use = "edit" },
  { name = "*.js",             use = "edit" },
  { name = "*.ts",             use = "edit" },
  { name = "*.rs",             use = "edit" },
  { name = "*.go",             use = "edit" },
  { name = "*.c",              use = "edit" },
  { name = "*.h",              use = "edit" },
  { name = "*.cpp",            use = "edit" },
  { name = "*.lua",            use = "edit" },
  { name = "*",                use = "edit" },
]
