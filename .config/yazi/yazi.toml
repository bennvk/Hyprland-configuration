[mgr]
ratio = [1, 3, 4]
linemode = "size_and_mtime"

[preview]
max_width = 1500
max_height = 750

[opener]
edit = [
  { run = "$EDITOR %s",  block = true,  desc = "Neovim" },
  { run = "codium %s",   orphan = true, desc = "VSCodium" },
]
view_image = [
  { run = "swayimg %s",  orphan = true, desc = "Swayimg" },
]
view_document = [
  { run = '$BROWSER "%s"', orphan = true, desc = "Firefox" },
]

[open]
rules = [
  { url = "*.pdf",   use = "view_document" },
  { url = "*.html",  use = [ "edit", "view_document" ] },
  { url = "*.png",   use = "view_image" },
  { url = "*.jpg",   use = "view_image" },
  { url = "*.jpeg",  use = "view_image" },
  { url = "*.heif",  use = "view_image" },
  { url = "*.heic",  use = "view_image" },
  { url = "*.webp",  use = "view_image" },
  { url = "*.svg",   use = "view_image" },
  { url = "*.txt",   use = "edit" },
  { url = "*.json",  use = "edit" },
  { url = "*.sh",    use = "edit" },
  { url = "*.py",    use = "edit" },
  { url = "*.toml",  use = "edit" },
  { url = "*.yaml",  use = "edit" },
  { url = "*.yml",   use = "edit" },
  { url = "*.xml",   use = "edit" },
  { url = "*.csv",   use = "edit" },
  { url = "*.js",    use = "edit" },
  { url = "*.ts",    use = "edit" },
  { url = "*.rs",    use = "edit" },
  { url = "*.go",    use = "edit" },
  { url = "*.c",     use = "edit" },
  { url = "*.h",     use = "edit" },
  { url = "*.cpp",   use = "edit" },
  { url = "*.lua",   use = "edit" },
  { url = "*",       use = "edit" },
]
